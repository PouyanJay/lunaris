<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linear Function Simulator</title><style>:root{--paper:#f7f8fa;--ink:#12151c;--line:#6b7280;--accent:#2563eb;--space:16px;--radius:5px;--control:44px}@media(prefers-color-scheme:dark){:root{--paper:#0f1117;--ink:#e6edf3;--line:#6e7681}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}*{margin:0;padding:0;box-sizing:border-box}html{font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper)}body{padding:var(--space);display:flex;justify-content:center;min-height:100vh}main{width:1100px;display:flex;flex-direction:column;gap:calc(var(--space)*1.5)}section{border:1px solid var(--line);border-radius:var(--radius);padding:var(--space);background:var(--paper)}h1{font-size:1.5rem;margin-bottom:var(--space);font-weight:600}h2{font-size:1.125rem;margin-bottom:calc(var(--space)*0.75);font-weight:600}.control-group{display:flex;flex-direction:column;gap:calc(var(--space)*0.5);margin-bottom:var(--space)}.control-label{font-size:0.875rem;font-weight:500;color:var(--line)}.control-row{display:flex;align-items:center;gap:var(--space)}.input-slider{flex:1;height:6px;border-radius:3px;border:1px solid var(--line);-webkit-appearance:none;appearance:none;background:var(--line);cursor:pointer}.input-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:var(--control);height:var(--control);border-radius:50%;background:var(--accent);border:2px solid var(--paper);cursor:pointer;box-shadow:0 0 0 1px var(--line)}.input-slider::-moz-range-thumb{width:var(--control);height:var(--control);border-radius:50%;background:var(--accent);border:2px solid var(--paper);cursor:pointer;box-shadow:0 0 0 1px var(--line)}.value-display{font-family:monospace;font-size:1rem;font-weight:500;min-width:60px;text-align:right;color:var(--ink)}.output-row{display:flex;justify-content:space-between;padding:calc(var(--space)*0.75) 0;border-bottom:1px solid var(--line)}.output-row:last-child{border-bottom:none}.output-label{font-size:0.875rem;color:var(--line);font-weight:500}.output-value{font-family:monospace;font-size:1rem;font-weight:600;color:var(--accent)}.button{padding:calc(var(--space)*0.75) var(--space);border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);cursor:pointer;font-size:0.875rem;font-weight:500;font-family:system-ui}.button:hover:not(:disabled){background:var(--accent);color:var(--paper);border-color:var(--accent)}.button:disabled{opacity:0.5;cursor:not-allowed}svg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}.desc{font-size:0.875rem;color:var(--line);margin-bottom:var(--space)}</style></head><body><main><section><h1>Linear Function: y = 2x</h1><p class="desc">Adjust x to see how y changes according to the equation y = 2x.</p><div class="control-group"><label class="control-label" for="x-slider">x value</label><div class="control-row"><input id="x-slider" class="input-slider" type="range" min="0" max="10" step="0.5" value="5.0" data-sim-param="x" aria-label="x parameter from 0 to 10"><span class="value-display" aria-live="polite">5.0</span></div></div><div style="border-top:1px solid var(--line);padding-top:var(--space);margin-top:var(--space)"><h2>Results</h2><div class="output-row"><span class="output-label">y</span><span class="output-value" data-sim-output="y" aria-live="polite">10</span></div><div class="output-row"><span class="output-label">x_label</span><span class="output-value" data-sim-output="x_label">x</span></div><div class="output-row"><span class="output-label">y_label</span><span class="output-value" data-sim-output="y_label">y</span></div></div><button class="button" data-sim-action="discuss" aria-label="Discuss current parameters">Discuss Results</button></section><section><h2>Function Visualization</h2><svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Graph of y equals 2x showing linear relationship"><defs><style>text{font-family:system-ui;font-size:12px}.axis-line{stroke:var(--ink);stroke-width:2}.grid-line{stroke:var(--line);stroke-width:1;opacity:0.3}.axis-label{fill:var(--ink);font-weight:500;font-size:13px}.tick-label{fill:var(--ink);font-size:11px}.plot-point{fill:var(--accent);stroke:var(--paper);stroke-width:2}.plot-line{stroke:var(--accent);stroke-width:2.5;fill:none}</style></defs><g><line class="axis-line" x1="70" y1="380" x2="650" y2="380"/><line class="axis-line" x1="70" y1="40" x2="70" y2="380"/><g class="grid-line"><line x1="70" y1="40" x2="70" y2="380"/><line x1="130" y1="40" x2="130" y2="380"/><line x1="190" y1="40" x2="190" y2="380"/><line x1="250" y1="40" x2="250" y2="380"/><line x1="310" y1="40" x2="310" y2="380"/><line x1="370" y1="40" x2="370" y2="380"/><line x1="430" y1="40" x2="430" y2="380"/><line x1="490" y1="40" x2="490" y2="380"/><line x1="550" y1="40" x2="550" y2="380"/><line x1="610" y1="40" x2="610" y2="380"/><line x1="70" y1="380" x2="650" y2="380"/><line x1="70" y1="340" x2="650" y2="340"/><line x1="70" y1="300" x2="650" y2="300"/><line x1="70" y1="260" x2="650" y2="260"/><line x1="70" y1="220" x2="650" y2="220"/><line x1="70" y1="180" x2="650" y2="180"/><line x1="70" y1="140" x2="650" y2="140"/><line x1="70" y1="100" x2="650" y2="100"/><line x1="70" y1="60" x2="650" y2="60"/></g><polyline class="plot-line" points="70,380 130,360 190,340 250,320 310,300 370,280 430,260 490,240 550,220 610,200"/><circle class="plot-point" cx="310" cy="300" r="5" id="current-point"/><text class="axis-label" x="665" y="375">x</text><text class="axis-label" x="30" y="50">y</text><text class="tick-label" x="70" y="400">0</text><text class="tick-label" x="130" y="400">1</text><text class="tick-label" x="190" y="400">2</text><text class="tick-label" x="250" y="400">3</text><text class="tick-label" x="310" y="400">4</text><text class="tick-label" x="370" y="400">5</text><text class="tick-label" x="430" y="400">6</text><text class="tick-label" x="490" y="400">7</text><text class="tick-label" x="550" y="400">8</text><text class="tick-label" x="610" y="400">9</text><text class="tick-label" x="55" y="385">0</text><text class="tick-label" x="55" y="345">2.5</text><text class="tick-label" x="55" y="305">5</text><text class="tick-label" x="55" y="265">7.5</text><text class="tick-label" x="55" y="225">10</text><text class="tick-label" x="55" y="185">12.5</text><text class="tick-label" x="55" y="145">15</text><text class="tick-label" x="55" y="105">17.5</text><text class="tick-label" x="55" y="65">20</text></g></svg></section></main><script>const state={x:5.0};let appId=null,instanceId=null,active=true;function updateDisplay(){const x=state.x;const y=2*x;document.querySelector('[data-sim-param="x"]').value=x.toFixed(1);document.querySelector('.value-display').textContent=x.toFixed(1);document.querySelector('[data-sim-output="y"]').textContent=y.toFixed(0);document.querySelector('[data-sim-output="x_label"]').textContent='x';document.querySelector('[data-sim-output="y_label"]').textContent='y';const px=70+(Math.max(0,Math.min(10,x))/10)*580;const py=380-(Math.max(0,Math.min(20,y))/20)*340;document.getElementById('current-point').setAttribute('cx',px.toFixed(1));document.getElementById('current-point').setAttribute('cy',py.toFixed(1))}function handleSliderChange(e){state.x=parseFloat(e.target.value);updateDisplay()}function handleDiscuss(){if(!active)return;if(appId&&instanceId){window.parent.postMessage({type:'lunaris.sim.event',version:1,appId,instanceId,kind:'param_changed',state:{x:state.x}},"*")}}document.getElementById('x-slider').addEventListener('input',handleSliderChange);document.querySelector('[data-sim-action="discuss"]').addEventListener('click',handleDiscuss);window.addEventListener('message',e=>{if(e.source!==window.parent)return;if(e.data?.version!==1)return;if(e.data.type==='lunaris.sim.init'){appId=e.data.appId;instanceId=e.data.instanceId;if(typeof e.data.state?.x==='number'){state.x=e.data.state.x}updateDisplay()}else if(e.data.type==='lunaris.sim.command'){if(e.data.instanceId!==instanceId)return;if(typeof e.data.state?.x==='number'){state.x=e.data.state.x}updateDisplay()}else if(e.data.type==='lunaris.sim.availability'){active=Boolean(e.data.active);document.querySelector('[data-sim-action="discuss"]').disabled=!active}});updateDisplay();window.parent.postMessage({type:'lunaris.sim.ready',version:1},"*");</script></body></html>
